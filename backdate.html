<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Default fallback tag -->
    <meta id="medium-date" property="article:published_time" content="2022-01-01T12:00:00.000Z">

    <title>Medium Backdater</title>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const customDate = urlParams.get('date'); // Expects YYYY-MM-DD

        if (customDate) {
            try {
                // Appends noon timestamp to the input date string
                const noonDateString = `${customDate}T12:00:00`;
                const isoDate = new Date(noonDateString).toISOString();

                document.getElementById('medium-date').setAttribute('content', isoDate);
            } catch(e) {
                console.error("Invalid date format provided. Please use YYYY-MM-DD.");
            }
        }
    </script>
</head>

<body>
    <h1>Backdated Medium post</h1>
    <p>
        Paste this page's URL into Medium's <a href="https://medium.com/p/import">Import Tool</a> to set your post's custom timestamp.
    </p>
</body>
</html>
